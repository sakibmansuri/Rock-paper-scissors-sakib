<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rock Paper Scissors</title>
    <style>
        body {
            background: linear-gradient(to right, rgb(85, 80, 80), rgb(213, 215, 217));
        }

        .main {
            padding: 20px;
            margin: 30px;
            margin-top: 50px;
            height: 150px;
            width: 260px;
            font-size: 50px;
            font-family: 'Times New Roman', Times, serif;
            color: rgb(0, 0, 0);
            background: linear-gradient(to bottom, rgb(157, 193, 244), rgb(42, 35, 91));
            border: none;
            border-radius: 80px;
            transition: .3s;
        }

        .main:hover {
            transform: scale(1.2);
        }

        .reset {
            background: rgb(255, 253, 253);
            color: rgb(220, 103, 103);
            font-size: 20px;
            text-align: center;
        }

        .reset:hover{
            background-color: gray;
        }


    </style>
</head>

<body>

    <!-- 
    0 to <1/3 = rock
    1/3 to <2/3 = paper
    2/3 to 1 = scissors 
    -->
    <button class="main" onclick="
    played('rock')">ROCK</button>

    <button class="main" onclick="
    played('paper')">PAPER</button>

    <button class="main" onclick="
    played('scissors')">SCISSORS</button>

    <button class="reset" onclick="
    score.wins = 0;
    score.losses = 0;
    score.ties = 0;
    localStorage.removeItem('score');
    alert('Score Reset.')
    ">RESET SCORE</button>
    <!-- 
    0 to <1/3 = rock
    1/3 to <2/3 = paper
    2/3 to 1 = scissors 
    -->

    <script>
        let score = JSON.parse(localStorage.getItem('score')) || {
                wins: 0,
                losses: 0,
                ties: 0
            };
            
        /* DOES SAME AS ABOVE.
        if (!score) {
            score = {
                wins: 0,
                losses: 0,
                ties: 0
            };
        }
        */

        function played(daMove) {
            const compMove = pickCompMove();

            let result = '';

            if (daMove === 'rock') {
                if (compMove === 'rock') {
                    result = 'Tie';
                }
                else if (compMove === 'paper') {
                    result = 'You lose';
                }
                else if (compMove === 'scissors') {
                    result = 'You win';
                }

            } else if (daMove === 'paper') {
                if (compMove === 'rock') {
                    result = 'You win';
                }
                else if (compMove === 'paper') {
                    result = 'Tie';
                }
                else if (compMove === 'scissors') {
                    result = 'You lose';
                }

            } else if (daMove === 'scissors') {
                if (compMove === 'rock') {
                    result = 'You lose';
                }
                else if (compMove === 'paper') {
                    result = 'You win';
                }
                else if (compMove === 'scissors') {
                    result = 'Tie';
                }
            }

            if (result === 'You win') {
                score.wins += 1;
            } else if (result === 'You lose') {
                score.losses += 1;
            } else if (result === 'Tie') {
                score.ties += 1;
            }

            localStorage.setItem('score' , JSON.stringify(score));

            alert(`You picked ${daMove}. Computer picked ${compMove}. ${result}. 
Wins: ${score.wins}, Losses: ${score.losses}, Ties: ${score.ties}`);
        }

        function pickCompMove() {
            let randomNo = Math.random();
            let compMove = '';

            if (randomNo >= 0 && randomNo < 1 / 3) {
                compMove = 'rock';
            }
            else if (randomNo >= 1 / 3 && randomNo < 2 / 3) {
                compMove = 'paper';
            }
            else if (randomNo >= 2 / 3 && randomNo < 1) {
                compMove = 'scissors';
            }

            return compMove;
        }
    </script>
</body>

</html>
